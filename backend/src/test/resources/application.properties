spring.datasource.url=jdbc:h2:mem:pallanthir;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

server.error.include-message=always

app.cors.allowed-origins=http://localhost:3000
app.frontend-url=http://localhost:3000

brevo.api-key=teste
brevo.remetente=teste@pallanthir.local

spring.mongodb.uri=mongodb://localhost:27017/?serverSelectionTimeoutMS=500
spring.mongodb.database=pallanthir-teste

mercadopago.access-token=teste
mercadopago.webhook-secret=teste

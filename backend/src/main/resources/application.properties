spring.datasource.url=${SUPABASE_URL}
spring.datasource.username=${SUPABASE_USER}
spring.datasource.password=${SUPABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
server.error.include-message=always

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://pallanthir.vercel.app,https://*.vercel.app}

brevo.api-key=${BREVO_API_KEY:}
brevo.remetente=${EMAIL_REMETENTE:}
app.frontend-url=${FRONTEND_URL:https://pallanthir.vercel.app}

spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:pallanthir}

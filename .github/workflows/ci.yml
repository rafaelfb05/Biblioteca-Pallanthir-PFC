name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Back-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: chave-usada-somente-nos-testes-do-github-actions-ci
      CODIGO_FUNCIONARIO: codigo-usado-somente-nos-testes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Compilar e testar
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testar
        run: npm test -- --watchAll=false

      - name: Gerar build
        run: npm run build
